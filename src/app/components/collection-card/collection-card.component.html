<div class="collection-card" (click)="onView()">
  <div class="collection-card-content">
    <div class="collection-icon-wrapper">
      <app-icon name="folder" class="collection-icon"></app-icon>
    </div>
    <div class="collection-info">
      <h3 class="collection-title">{{ collection.name }}</h3>
      @if (collection.description) {
        <p class="collection-description">{{ collection.description }}</p>
      }
    </div>
    <div class="collection-actions" (click)="$event.stopPropagation()">
      @if (showPin) {
        <span class="pin-wrap" [class.on]="pinned">
          <app-btn
            [icon]="pinned ? 'star-fill' : 'star'"
            variant="ghost"
            [rounded]="true"
            [title]="pinned ? 'Unpin' : 'Pin'"
            (click)="onPin($event)">
          </app-btn>
        </span>
      }
      @if (canShare) {
        <app-btn
          class="card-quick"
          icon="share-alt"
          variant="ghost"
          [rounded]="true"
          title="Share"
          [loading]="sharing"
          (click)="shareCollection($event)">
        </app-btn>
      }
      <app-btn #deleteButton icon="ellipsis-v" variant="ghost" [rounded]="true" title="Options" (click)="onMenuToggle($event)"></app-btn>
      <app-menu #menu [items]="menuItems"></app-menu>
    </div>
  </div>
</div>
