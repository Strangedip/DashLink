<div class="ws-node-card" (click)="onClick()">
  <div class="ws-node-card-content">
    <div class="node-main">
      @if (imageUrl) {
        <div class="node-thumbnail">
          <img [src]="getThumbnailUrl(imageUrl)" alt="" loading="lazy" decoding="async" (error)="$any($event.target).style.display='none'">
        </div>
      } @else {
        <div class="node-icon-wrapper">
          <app-icon name="file-edit" class="node-icon"></app-icon>
        </div>
      }
      <div class="node-info">
        <h3 class="node-title">{{ node.name }}</h3>
        @if (node.description) {
          <p class="node-description">{{ node.description }}</p>
        }
        <div class="node-meta">
          <div class="creator-info">
            @if (node.creatorPhotoURL) {
              <app-avatar [image]="node.creatorPhotoURL" [size]="20"></app-avatar>
            } @else {
              <app-avatar [label]="creatorInitial" [size]="20"></app-avatar>
            }
            <span class="creator-name">{{ node.creatorName }}</span>
          </div>
          <span class="date-info">
            <app-icon name="calendar"></app-icon>
            {{ createdDate }}
          </span>
        </div>
      </div>
    </div>
    @if (hasActions) {
      <div class="node-actions" (click)="$event.stopPropagation()">
        @if (primaryUrl) {
          <app-btn type="button" icon="external-link" (click)="openLink($event)" class="action-button card-quick" title="Open link" variant="ghost" [rounded]="true"></app-btn>
          <app-btn type="button" icon="share-alt" (click)="shareLink($event)" class="action-button card-quick" title="Share" variant="ghost" [rounded]="true"></app-btn>
        }
        @if (menuItems.length) {
          <app-btn type="button" icon="ellipsis-v" (click)="onMenuToggle($event)" class="action-button" title="Options" variant="ghost" [rounded]="true">
          </app-btn>
          <app-menu #menu [items]="menuItems"></app-menu>
        }
      </div>
    }
  </div>
</div>
