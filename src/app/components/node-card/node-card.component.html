<div class="node-card" (click)="onView()">
  <div class="node-card-content">
    @if (nodeImageUrl) {
      <div class="node-image-thumbnail">
        <img
          [src]="getThumbnailUrl(nodeImageUrl)"
          alt="Node thumbnail"
          class="thumbnail-image"
          loading="lazy"
          decoding="async"
          (error)="$any($event.target).style.display='none'"
        />
      </div>
    } @else {
      <div class="node-icon-wrapper">
        <app-icon name="link" class="node-icon"></app-icon>
      </div>
    }
    <div class="node-info">
      <h3 class="node-title">{{ node.name }}</h3>
      @if (node.description) {
        <p class="node-description" [innerHTML]="node.description"></p>
      }
    </div>
    <div class="node-actions" (click)="$event.stopPropagation()">
      @if (primaryUrl) {
        <app-btn class="card-quick" icon="external-link" variant="ghost" [rounded]="true" title="Open link" (click)="openLink($event)"></app-btn>
        <app-btn class="card-quick" icon="share-alt" variant="ghost" [rounded]="true" title="Share" (click)="shareLink($event)"></app-btn>
      }
      <app-btn #deleteButton icon="ellipsis-v" variant="ghost" [rounded]="true" title="Options" (click)="onMenuToggle($event)"></app-btn>
      <app-menu #menu [items]="menuItems"></app-menu>
    </div>
  </div>
</div>
